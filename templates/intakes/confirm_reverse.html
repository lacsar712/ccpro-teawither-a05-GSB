{% extends "base.html" %}
{% block title %}冲销签收{% endblock %}
{% block content %}
<div class="page-header">
  <h1>冲销鲜叶签收</h1>
</div>
<div class="card">
  <p>确认冲销签收「{{ object }}」？冲销后该记录不再计入槽位累计与首页本周合计，仅主管可执行。</p>
  <form method="post" class="actions">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">确认冲销</button>
    <a class="btn btn-secondary" href="{% url 'intake_list' %}">取消</a>
  </form>
</div>
{% endblock %}
